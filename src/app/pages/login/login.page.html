<ion-header>
  <ion-toolbar>
    <ion-title>Entrar</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form class="form-page stack" [formGroup]="form" (ngSubmit)="submit()">
    <p class="lead">Entra para ver la cartelera.</p>
    <ion-input
      label="Correo"
      labelPlacement="stacked"
      type="email"
      inputmode="email"
      autocomplete="email"
      fill="outline"
      maxlength="254"
      formControlName="email"
    ></ion-input>
    <ion-input
      label="Contraseña"
      labelPlacement="stacked"
      type="password"
      autocomplete="current-password"
      fill="outline"
      minlength="6"
      maxlength="72"
      formControlName="password"
    ></ion-input>
    @if (error()) {
      <p id="form-error" class="form-error" role="alert" tabindex="-1">{{ error() }}</p>
    }
    <ion-button expand="block" type="submit" [disabled]="busy()">
      {{ busy() ? 'Entrando…' : 'Entrar' }}
    </ion-button>
    <ion-button expand="block" fill="clear" routerLink="/register">Crear cuenta</ion-button>
  </form>
</ion-content>
