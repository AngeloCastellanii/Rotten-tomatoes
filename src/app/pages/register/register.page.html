<ion-header>
  <ion-toolbar>
    <ion-title>Rotten Potatoes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form class="form-page stack" [formGroup]="form" (ngSubmit)="submit()">
    <img class="brand-mark" src="assets/icon/potato.png" alt="Rotten Potatoes" width="72" height="72" />
    <p class="lead">El público y los críticos puntúan por separado.</p>
    <ion-input
      label="Nombre"
      labelPlacement="stacked"
      autocomplete="name"
      fill="outline"
      minlength="2"
      maxlength="60"
      formControlName="name"
    ></ion-input>
    <ion-input
      label="Correo"
      labelPlacement="stacked"
      type="email"
      inputmode="email"
      autocomplete="email"
      fill="outline"
      maxlength="254"
      formControlName="email"
    ></ion-input>
    <ion-input
      label="Contraseña"
      labelPlacement="stacked"
      type="password"
      autocomplete="new-password"
      fill="outline"
      minlength="6"
      maxlength="72"
      helperText="Mínimo 6 caracteres."
      formControlName="password"
    ></ion-input>
    <ion-segment [value]="role()" (ionChange)="onRole($event)" aria-label="Rol">
      <ion-segment-button value="audience">
        <ion-label>Público</ion-label>
      </ion-segment-button>
      <ion-segment-button value="critic">
        <ion-label>Crítico</ion-label>
      </ion-segment-button>
    </ion-segment>
    @if (error()) {
      <p id="form-error" class="form-error" role="alert" tabindex="-1">{{ error() }}</p>
    }
    <ion-button expand="block" type="submit" [disabled]="busy()">
      {{ busy() ? 'Creando…' : 'Registrarme' }}
    </ion-button>
    <ion-button expand="block" fill="clear" routerLink="/login">Ya tengo cuenta</ion-button>
  </form>
</ion-content>
