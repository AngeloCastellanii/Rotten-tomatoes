<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <img class="toolbar-mark" src="assets/icon/potato.png" alt="" width="28" height="28" />
    </ion-buttons>
    <ion-title>Rotten Potatoes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form class="form-page stack" [formGroup]="form" (ngSubmit)="save()">
    <h2 class="section-title">Cuenta</h2>
    <ion-input
      label="Nombre"
      labelPlacement="stacked"
      autocomplete="name"
      fill="outline"
      minlength="2"
      maxlength="60"
      formControlName="name"
    ></ion-input>
    <ion-input
      label="Correo"
      labelPlacement="stacked"
      type="email"
      inputmode="email"
      autocomplete="email"
      fill="outline"
      maxlength="254"
      formControlName="email"
    ></ion-input>
    <ion-input
      label="Nueva contraseña"
      labelPlacement="stacked"
      type="password"
      autocomplete="new-password"
      fill="outline"
      maxlength="72"
      formControlName="password"
      helperText="Déjala vacía si no quieres cambiarla."
    ></ion-input>
    <ion-segment [value]="role()" (ionChange)="onRole($event)" aria-label="Rol">
      <ion-segment-button value="audience">
        <ion-label>Público</ion-label>
      </ion-segment-button>
      <ion-segment-button value="critic">
        <ion-label>Crítico</ion-label>
      </ion-segment-button>
    </ion-segment>
    @if (error()) {
      <p id="form-error" class="form-error" role="alert" tabindex="-1">{{ error() }}</p>
    }
    @if (notice()) {
      <p class="form-success" role="status">{{ notice() }}</p>
    }
    <ion-button expand="block" type="submit" [disabled]="busy()">Guardar</ion-button>
  </form>

  <section class="form-page stack">
    <h2 class="section-title">Preferencias</h2>
    <ion-item lines="none">
      <ion-toggle
        [checked]="theme.dark()"
        (ionChange)="theme.setDark($any($event.detail.checked))"
      >
        Tema oscuro
      </ion-toggle>
    </ion-item>
    <ion-button expand="block" fill="outline" (click)="logout()">Cerrar sesión</ion-button>
    <ion-button expand="block" color="danger" fill="clear" (click)="confirmDelete()">
      Borrar cuenta
    </ion-button>
  </section>
</ion-content>
